<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 독서록</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="우리 가족이 함께 쓰는 독서 기록장">
<meta property="og:type" content="website">
<meta property="og:title" content="우리집 독서록">
<meta property="og:description" content="우리 가족이 함께 쓰는 독서 기록장 · 비밀번호로 들어와요">
<meta property="og:image" content="https://hgbbang84-coder.github.io/github-pages/books/images/desk.jpg">
<meta property="og:url" content="https://hgbbang84-coder.github.io/github-pages/books/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --soft: #f5f6f3;
    --panel: #f1f3ee;
    --paper: #ffffff;
    --ink: #131313;
    --muted: #767676;
    --line: #ebebeb;
    --accent: #9bce26;          /* 라임 (채우기) */
    --accent-ink: #131313;      /* 라임 위 글자 */
    --accent-text: #4f7d0c;     /* 글자·테두리용 진한 초록 */
    --accent-soft: #f2f9e3;
    --pink: #ff4f6d;
    --star: #ff9f00;
    --heart: #ff4f6d;
    --danger: #d9363e;
    --rule: #eeeeee;
    --quote-bg: #f7f8f4;
    --good: #4f7d0c;
    --shadow: 0 2px 10px rgba(0,0,0,.06);
    --shadow-lg: 0 14px 40px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark; --bg: #111311; --soft: #1a1d19; --panel: #1f231e; --paper: #191c18; --ink: #f2f2f2; --muted: #9b9b9b;
      --line: #2b2f2a; --accent: #a8d93a; --accent-ink: #111311; --accent-text: #b9e25e; --accent-soft: #232c14; --pink: #ff6b84;
      --star: #ffb23f; --heart: #ff6b84; --danger: #ff6b6b; --rule: #2b2f2a; --quote-bg: #1f231e; --good: #b9e25e;
      --shadow: 0 2px 10px rgba(0,0,0,.4); --shadow-lg: 0 14px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark; --bg: #111311; --soft: #1a1d19; --panel: #1f231e; --paper: #191c18; --ink: #f2f2f2; --muted: #9b9b9b;
    --line: #2b2f2a; --accent: #a8d93a; --accent-ink: #111311; --accent-text: #b9e25e; --accent-soft: #232c14; --pink: #ff6b84;
    --star: #ffb23f; --heart: #ff6b84; --danger: #ff6b6b; --rule: #2b2f2a; --quote-bg: #1f231e; --good: #b9e25e;
    --shadow: 0 2px 10px rgba(0,0,0,.4); --shadow-lg: 0 14px 40px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-weight: 700; letter-spacing: -.02em; }
  .serif { font-family: "Gowun Batang", serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  /* ---------- 버튼 ---------- */
  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 16px; cursor: pointer; white-space: nowrap; transition: border-color .15s, transform .1s; }
  .btn:hover { border-color: var(--ink); }
  .btn:active { transform: scale(.97); }
  .btn-primary, .btn-cta { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); font-weight: 700; border-radius: 10px; padding: 9px 18px; cursor: pointer; white-space: nowrap; transition: filter .15s, transform .1s; }
  .btn-primary:hover, .btn-cta:hover { filter: brightness(1.06); }
  .btn-primary:active, .btn-cta:active { transform: scale(.97); }
  .btn-dark { background: var(--ink); color: var(--bg); border: 1px solid var(--ink); font-weight: 700; border-radius: 10px; padding: 9px 18px; cursor: pointer; }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); }
  .btn.sm, .btn-primary.sm { padding: 4px 12px; font-size: 13px; border-radius: 8px; }
  .btn:disabled, .btn-primary:disabled { opacity: .55; cursor: default; }
  .link-btn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- 얼굴(이니셜 또는 사진) ---------- */
  .av { display: inline-grid !important; place-items: center; justify-content: center; align-content: center; text-align: center; width: 30px; height: 30px; border-radius: 50%; flex: none; overflow: hidden;
    background: var(--kc, #555); color: #fff; font-size: 13px; font-weight: 700; line-height: 1; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .av.sm { width: 22px; height: 22px; font-size: 11px; }
  .av.md { width: 40px; height: 40px; font-size: 15px; }
  .av.lg { width: 72px; height: 72px; font-size: 26px; }
  .av.xl { width: 62px; height: 62px; font-size: 20px; }

  /* ---------- 입장 ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: linear-gradient(rgba(10,14,5,.35), rgba(10,14,5,.5)), url("images/desk.jpg") center / cover no-repeat; }
  .login-card { background: #fff; color: #131313; border-radius: 22px; box-shadow: 0 24px 70px rgba(0,0,0,.35); padding: 40px 30px 30px; width: 100%; max-width: 360px; text-align: center; }
  .login-card .brand { font-size: 28px; justify-content: center; margin-bottom: 4px; }
  .login-card p { margin: 0 0 22px; color: #767676; }
  .pw-input { width: 100%; padding: 13px; font-size: 22px; letter-spacing: .4em; text-align: center; border: 2px solid #ebebeb; border-radius: 12px; background: #fff; color: #131313; }
  .pw-input:focus { outline: none; border-color: #9bce26; }
  .pw-input::placeholder { letter-spacing: normal; font-size: 16px; color: #aaa; }
  .login-card .btn-cta { width: 100%; margin-top: 12px; padding: 13px; font-size: 16px; }
  .err { color: var(--danger); min-height: 1.5em; margin-top: 8px; font-size: 14px; }

  /* ---------- 상단 ---------- */
  .brand { display: inline-flex; align-items: baseline; gap: 2px; font-weight: 900; font-size: 24px; letter-spacing: -.04em; white-space: nowrap; cursor: pointer; border: 0; background: none; padding: 0; }
  .brand b { color: var(--accent-text); font-weight: 900; }
  .brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); display: inline-block; margin-left: 2px; transform: translateY(-12px); }
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top-in { display: flex; align-items: center; gap: 24px; padding: 14px 20px 10px; max-width: 1200px; margin: 0 auto; }
  .searchbar { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 10px; border: 2px solid var(--accent); border-radius: 99px; padding: 0 18px; background: var(--paper); }
  .searchbar svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2.2; stroke-linecap: round; flex: none; }
  .searchbar input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 10px 0; font-size: 15px; }
  .top-in .btn-cta { margin-left: auto; }
  .gnb { display: flex; gap: 4px; max-width: 1200px; margin: 0 auto; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
  .gnb::-webkit-scrollbar { display: none; }
  .nav-btn { position: relative; border: 0; background: none; padding: 10px 12px 12px; cursor: pointer; font-size: 15px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .nav-btn:hover { color: var(--ink); }
  .nav-btn[aria-current="page"] { color: var(--ink); font-weight: 700; }
  .nav-btn[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px; background: var(--accent); animation: grow-x .3s ease-out; }
  .nav-btn .dot-new { position: absolute; top: 8px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--pink); }

  main { padding: 20px 0 60px; }

  /* 가족 스토리 */
  .stories { display: flex; gap: 18px; overflow-x: auto; padding: 4px 2px 14px; scrollbar-width: none; }
  .stories::-webkit-scrollbar { display: none; }
  .story { border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 70px; }
  .story .ring { padding: 3px; border-radius: 50%; background: var(--line); display: grid; transition: transform .15s; }
  .story .ring > .av { border: 3px solid var(--bg); box-sizing: content-box; }
  .story.fresh .ring { background: conic-gradient(from 0deg, var(--accent), #ffd400, var(--pink), var(--accent)); animation: spin 4s linear infinite; }
  .story.fresh .ring > .av { animation: spin 4s linear infinite reverse; }
  .story:hover .ring { transform: scale(1.06); }
  .story .sn { font-size: 13px; font-weight: 500; }
  .story .sc { font-size: 11px; color: var(--muted); margin-top: -4px; }
  .story.on .sn { font-weight: 900; }
  .story.on .ring { background: var(--ink); animation: none; }
  .story.on .ring > .av { animation: none; }
  .story .plus { width: 68px; height: 68px; place-items: center; font-size: 28px; color: var(--muted); background: var(--soft); border: 2px dashed var(--line); padding: 0; }

  /* 배너 캐러셀 */
  .hero { position: relative; border-radius: 22px; overflow: hidden; height: 300px; margin-bottom: 14px; background: var(--soft); }
  .track { display: flex; height: 100%; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .slide { flex: 0 0 100%; min-width: 0; width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 34px 56px; color: #fff; overflow: hidden; }
  .slide h2 { margin: 6px 0 8px; font-size: 38px; line-height: 1.15; font-weight: 900; letter-spacing: -.03em; }
  .slide p { margin: 0 0 6px; opacity: .92; }
  .eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.2); }
  .s-goal { background: linear-gradient(90deg, rgba(10,14,5,.82), rgba(10,14,5,.35)), url("images/desk.jpg") center 60% / cover; }
  .s-goal h2 b { color: var(--accent); }
  .s-gauge { width: min(440px, 100%); height: 14px; border-radius: 99px; background: rgba(255,255,255,.22); display: flex; overflow: hidden; margin: 6px 0 10px; }
  .s-gauge span { height: 100%; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .s-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  .s-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .s-book { background: linear-gradient(120deg, hsl(var(--h) 45% 32%), hsl(calc(var(--h) + 40) 50% 22%)); }
  .s-book .s-one { font-family: "Gowun Batang", serif; font-size: 17px; max-width: 520px; }
  .s-cover { width: 150px; height: 220px; flex: none; transform: rotate(4deg); filter: drop-shadow(0 18px 24px rgba(0,0,0,.4)); animation: float 5s ease-in-out infinite; }
  .s-quote { background: #131313; }
  .s-quote .qt { font-family: "Gowun Batang", serif; font-size: 26px; line-height: 1.5; max-width: 760px; margin-top: 18px; }
  .s-quote .qt::before { content: "“"; display: block; font-size: 70px; line-height: .6; color: var(--accent); margin-bottom: 6px; }
  .s-mission { background: var(--accent); color: #131313; }
  .s-mission .eyebrow { background: rgba(0,0,0,.1); }
  .s-mission .big { font-size: 110px; font-weight: 900; line-height: 1; letter-spacing: -.05em; opacity: .9; }
  .s-txt { position: relative; z-index: 1; min-width: 0; }
  .s-txt .btn-cta, .s-txt .btn-dark { margin-top: 12px; }
  .s-quote .btn-cta, .s-book .btn-cta, .s-goal .btn-cta { background: #fff; border-color: #fff; color: #131313; }
  .arr { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); color: #131313; cursor: pointer; font-size: 20px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; z-index: 2; }
  .hero:hover .arr { opacity: 1; }
  .arr.prev { left: 14px; } .arr.next { right: 14px; }
  .counter { position: absolute; right: 18px; bottom: 16px; background: rgba(0,0,0,.45); color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 99px; z-index: 2; }
  .dots { position: absolute; left: 56px; bottom: 18px; display: flex; gap: 6px; z-index: 2; }
  .dot { width: 8px; height: 8px; border-radius: 99px; border: 0; padding: 0; background: rgba(255,255,255,.5); cursor: pointer; transition: width .3s; }
  .dot.on { width: 24px; background: #fff; }
  .s-mission ~ .dots .dot { background: rgba(0,0,0,.25); }

  /* 소식 띠 */
  .ticker { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-bottom: 26px; overflow: hidden; }
  .tk-label { flex: none; font-size: 12px; font-weight: 900; color: var(--accent-ink); background: var(--accent); padding: 2px 10px; border-radius: 99px; }
  .tk-view { flex: 1; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
  .tk-move { display: inline-flex; gap: 40px; white-space: nowrap; animation: marquee 40s linear infinite; }
  .ticker:hover .tk-move { animation-play-state: paused; }
  .tk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .tk i { font-style: normal; color: var(--muted); font-size: 12px; }
  .tk .heart { color: var(--heart); }
  .notice { font-size: 13px; padding: 9px 14px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 18px; }
  .banner-btn { border: 0; background: none; color: var(--accent-text); font-weight: 700; cursor: pointer; padding: 0; margin-left: 8px; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

  /* ---------- 섹션 ---------- */
  .sec { margin-bottom: 40px; }
  .sec-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .sec-h h2 { margin: 0; font-size: 22px; font-weight: 900; }
  .sec-h h2 small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .sec-h p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  /* 랭킹 */
  .rank { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .rk { position: relative; border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); transition: transform .2s, box-shadow .2s; cursor: pointer; text-align: left; }
  .rk:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .rk .no { position: absolute; top: 12px; right: 14px; font-size: 34px; font-weight: 900; color: var(--line); letter-spacing: -.05em; line-height: 1; }
  .rk.first { border-color: var(--accent); background: var(--accent-soft); }
  .rk.first .no { color: var(--accent-text); }
  .rk .rp { display: flex; align-items: center; gap: 10px; }
  .rk .rn { font-weight: 900; font-size: 17px; }
  .rk .rc { font-size: 13px; color: var(--muted); }
  .rk .rc b { color: var(--ink); font-size: 20px; font-weight: 900; }
  .rk .mini-row { display: flex; gap: 6px; min-height: 58px; }
  .crown { position: absolute; top: -10px; left: 14px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 99px; animation: bob 1.6s ease-in-out infinite; }

  /* 가로 스크롤 */
  .hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: 180px; gap: 16px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .hscroll > * { scroll-snap-align: start; }

  /* 상품형 책 카드 */
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 28px 18px; }
  .pcard { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
  .pimg { position: relative; aspect-ratio: 1 / 1.08; border-radius: 14px; background: var(--soft); display: grid; place-items: center; overflow: hidden; margin-bottom: 8px; }
  .pimg .cv { width: 60%; aspect-ratio: 2 / 3; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .pimg .cv .cover { box-shadow: 4px 8px 18px rgba(0,0,0,.25); }
  .pcard:hover .pimg .cv, .pcard:focus-visible .pimg .cv { transform: translateY(-6px) scale(1.06) rotate(-1.5deg); }
  .pcard:focus-visible { outline: none; }
  .pcard:focus-visible .pimg { outline: 2px solid var(--accent); }
  .tags { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; z-index: 2; }
  .tag { font-size: 11px; font-weight: 900; padding: 1px 7px; border-radius: 4px; background: var(--ink); color: var(--bg); letter-spacing: .02em; }
  .tag.new { background: var(--accent); color: #131313; }
  .tag.best { background: var(--pink); color: #fff; }
  .tag.soft { background: var(--paper); color: var(--ink); border: 1px solid var(--line); font-weight: 700; }
  .pwho { position: absolute; right: 10px; bottom: 10px; z-index: 2; }
  .pwho .av { border: 2px solid var(--paper); }
  .ptitle { font-weight: 700; font-size: 15px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pauthor { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pmeta { display: flex; gap: 10px; font-size: 13px; align-items: center; margin-top: 2px; }
  .pmeta .st { color: var(--star); font-weight: 700; }
  .pmeta .ht { color: var(--heart); font-weight: 700; }
  .pmeta .cm { color: var(--muted); }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .pill[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  .pill .n { font-size: 11px; opacity: .65; margin-left: 4px; }
  .sel { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--paper); font-size: 14px; }
  .viewtog { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .viewtog button { border: 0; background: var(--paper); padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .viewtog button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
  .empty-row { text-align: center; color: var(--muted); padding: 30px 0; }
  .empty-cta { text-align: center; padding: 50px 20px; border: 2px dashed var(--line); border-radius: 18px; color: var(--muted); }
  .empty-cta b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }

  /* ---------- 원목 책장 보기 ---------- */
  .shelf-sec + .shelf-sec { margin-top: 26px; }
  .shelf-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px 2px; }
  .shelf-head h3 { margin: 0; font-size: 17px; }
  .shelf-head .cnt { color: var(--muted); font-size: 13px; }
  .case-frame { padding: 12px; border-radius: 6px; background: linear-gradient(rgba(70,40,15,.25), rgba(40,22,8,.35)), url("images/wood.jpg") center / 700px; box-shadow: 0 14px 30px rgba(40,22,8,.28), inset 0 1px 0 rgba(255,255,255,.25); }
  .case { padding: 0 16px; border-radius: 2px; background: linear-gradient(rgba(28,16,6,.82), rgba(20,11,4,.86)), url("images/wood.jpg") center / 900px; box-shadow: inset 0 0 50px rgba(0,0,0,.65), inset 0 12px 20px rgba(0,0,0,.5); }
  .row { padding-top: 26px; }
  .books { display: flex; gap: var(--gap, 22px); align-items: flex-end; padding: 0 10px; min-height: var(--bh, 152px); }
  .plank { height: 18px; margin: 0 -16px; position: relative; z-index: 1; background: linear-gradient(to bottom, rgba(255,240,220,.35) 0, rgba(255,240,220,0) 3px, rgba(0,0,0,0) 60%, rgba(0,0,0,.35) 100%), url("images/wood.jpg") center / 520px; box-shadow: 0 7px 10px -2px rgba(0,0,0,.55); }
  .shelf-empty { color: rgba(255,240,220,.55); font-size: 14px; align-self: center; padding-bottom: 20px; }

  /* ---------- 대화상자 ---------- */

function demoApi(action, data) {
  if (PW !== DEMO_PW) throw new Error('pw');
  const read = (k, def) => { try { const v = JSON.parse(store.get(k) || 'null'); return v ?? def; } catch { return def; } };
  // 예전 버전(readlog-demo3)에 써 둔 기록이 있으면 그대로 이어받음
  let list = read('readlog-demo4', null) ?? read('readlog-demo3', null);
  if (!Array.isArray(list)) list = demoSeed();
  let ph = read('readlog-demo-photos', {});
  let talk = read('readlog-demo-talk', []);
  let sets = read('readlog-demo-settings', {});
  const now = new Date().toISOString().slice(0, 19);
  const { pw, action: _a, ...d } = data;
  switch (action) {
    case 'search': {
      const q = (d.q || '').trim();
      const hit = DEMO_BOOKS.filter((b) => b.title.includes(q) || b.author.includes(q));
      return { ok: true, items: hit.length ? hit : DEMO_BOOKS };
    }
    case 'photo': if (d.photo) ph[d.name] = d.photo; else delete ph[d.name]; break;
    case 'settings': sets = { ...sets, ...d.settings }; break;
    case 'comment': talk.push({ id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), entryId: d.entryId, who: d.who, kind: d.kind === 'heart' ? 'heart' : 'comment', text: d.kind === 'heart' ? '' : d.text, at: now }); break;
    case 'uncomment': talk = talk.filter((c) => c.id !== d.id); break;
    case 'delete': list = list.filter((x) => x.id !== d.id); talk = talk.filter((c) => c.entryId !== d.id); break;
    case 'add': list.push({ ...d, id: 'd' + Date.now(), createdAt: now, updatedAt: now }); break;
    case 'update': {
      const i = list.findIndex((x) => x.id === d.id);
      if (i < 0) throw new Error('기록을 찾지 못했어요');
      list[i] = { ...list[i], ...d, updatedAt: now };
    }
  }
  store.set('readlog-demo4', JSON.stringify(list));
  store.set('readlog-demo-photos', JSON.stringify(ph));
  store.set('readlog-demo-talk', JSON.stringify(talk));
  store.set('readlog-demo-settings', JSON.stringify(sets));
  return { ok: true, me: { name: WHO || ADMIN, admin: true }, members: {}, entries: list, photos: ph, comments: talk, settings: sets };
}

function mapKakao(d) {
  const isbns = String(d.isbn || '').split(/\s+/).filter(Boolean);
  const tr = (d.translators || []).length ? ' (옮긴이 ' + d.translators.join(', ') + ')' : '';
  const m = String(d.thumbnail || '').match(/[?&]fname=([^&]+)/);
  return {
    title: d.title || '', author: (d.authors || []).join(', ') + tr, publisher: d.publisher || '',
    pubDate: String(d.datetime || '').slice(0, 10), isbn: isbns.find((s) => s.length === 13) || isbns[0] || '',
    description: d.contents || '', cover: m ? decodeURIComponent(m[1]).replace(/^http:/, 'https:') : (d.thumbnail || ''), link: d.url || '',
  };
}
async function kakaoDirect(q) {
  const r = await fetch('https://dapi.kakao.com/v3/search/book?size=24&query=' + encodeURIComponent(q), { headers: { Authorization: 'KakaoAK ' + LOCAL_KAKAO_KEY } });
  if (!r.ok) throw new Error('카카오 검색 오류 (' + r.status + ')');
  return ((await r.json()).documents || []).map(mapKakao);
}

}

const MARKS = [[0.18, '연필 한 자루'], [1.45, '초등학생 키'], [3.05, '농구 골대'], [5.5, '기린 키'], [10, '3층 건물'], [93, '자유의 여신상'], [249, '63빌딩']];
function heightText(m) {
  if (!m) return { h: '0cm', t: '첫 책을 쌓아 보세요' };
  const h = m < 1 ? Math.round(m * 100) + 'cm' : m.toFixed(1) + 'm';
  const passed = MARKS.filter(([v]) => m >= v).pop();
  const next = MARKS.find(([v]) => m < v);
  if (passed) return { h, t: `${passed[1]}보다 높아요` + (next ? ` · 다음은 ${next[1]}` : '') };
  return { h, t: `${next[1]}의 ${Math.round(m / next[0] * 100)}%` };
}
const weekOf = (iso) => { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(2001, 0, 1)) / 6048e5); };
const thisWeek = () => weekOf(todayISO());
function streaks(list) {
  const set = new Set(list.filter((e) => /^\d{4}-\d{2}-\d{2}/.test(e.finishedOn || '')).map((e) => weekOf(e.finishedOn)));
  let w = thisWeek(); if (!set.has(w)) w--;
  let cur = 0; while (set.has(w)) { cur++; w--; }
  let best = 0, run = 0, prev = null;
  [...set].sort((a, b) => a - b).forEach((x) => { run = prev !== null && x === prev + 1 ? run + 1 : 1; best = Math.max(best, run); prev = x; });
  return { cur, best, set };
}
function choOf(title) {
  const c = cleanTitle(title).replace(/^[^가-힣A-Za-z0-9]+/, '').charCodeAt(0) - 0xac00;
  return c >= 0 && c < 11172 ? CHO19[Math.floor(c / 588)] : null;
}

  const used = new Set();
  const cells = BINGO.map((b, i) => {
    if (i === 4) return null;
    const e = sorted.find((x) => b.test(x) && !used.has(x.id)) || sorted.find((x) => b.test(x));
    if (e) used.add(e.id);
    return e || null;
  });
  cells[4] = sorted.find((x) => !used.has(x.id)) || sorted[0] || null;
  return { cells, lines: LINES.filter((l) => l.every((i) => cells[i])) };
}

/* ============ 움직임: 숫자 올라가기 / 알림 / 꽃가루 ============ */
function countUp(root) {
  root.querySelectorAll('[data-count]').forEach((el) => {
    const to = +el.dataset.count || 0;
    if (reduceMotion() || !to) { el.textContent = to.toLocaleString(); return; }
    const t0 = performance.now(), dur = 900;
    const tick = (t) => { const p = Math.max(0, Math.min(1, (t - t0) / dur)); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString(); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
let toastT;
function toast(html) { const t = $('#toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3400); }
function confetti() {
  if (reduceMotion()) return;
  const cv = document.createElement('canvas'); cv.className = 'confetti';
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  document.body.appendChild(cv);
  const g = cv.getContext('2d');
  const colors = ['#9bce26', '#ff4f6d', '#ffd400', '#2f6fd0', '#ffffff', '#f08c00'];
  const ps = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * 200, y: H * .6, vx: (Math.random() - .5) * 16, vy: -Math.random() * 18 - 6, s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[Math.random() * colors.length | 0] }));
  const t0 = performance.now();
  (function frame(t) {
    g.clearRect(0, 0, W, H);
    ps.forEach((p) => { p.vy += .5; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
    if (t - t0 < 2400) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

  const y = awardYear;
  const list = allDone().filter((e) => inYear(e, y));
  const hearts = (e) => heartsOf(e.id).length;
  const top = (arr, score) => arr.slice().sort((a, b) => score(b) - score(a))[0];
  let n = 0;
  const card = (inner) => `<div class="award" style="--i:${n++}">${inner}</div>`;
  const bookCard = (name, e, extra = '') => e ? card(`<div class="an">${name}</div><div class="ab" data-id="${esc(e.id)}">${coverHTML(e)}<div><div class="at">${esc(cleanTitle(e.title))}</div><div class="aw">${av(e.kid, 'sm')}${esc(e.kid)} ${extra}</div></div></div>`) : '';
  const personCard = (name, k, line) => k ? card(`<div class="an">${name}</div><div class="person">${av(k, 'md')}<div><b>${esc(k)}</b><div class="aw">${line}</div></div></div>`) : '';
  const best = top(list, (e) => (+e.rating || 0) * 1000 + hearts(e) * 10 + Math.min(9, reviewLen(e) / 200));
  const bestQ = top(list.filter((e) => e.quote), (e) => hearts(e) * 1000 + (+e.rating || 0));
  const longest = top(list.filter(reviewLen), reviewLen);
  const loved = top(list.filter(hearts), hearts);
  const per = CONFIG.KIDS.map((k) => { const m = list.filter((e) => e.kid === k.name); return { k: k.name, n: m.length, g: new Set(m.map((e) => e.genre).filter(Boolean)).size, s: streaks(m).best }; });
  const most = per.filter((p) => p.n).sort((a, b) => b.n - a.n)[0];
  const explorer = per.filter((p) => p.g).sort((a, b) => b.g - a.g)[0];
  const steady = per.filter((p) => p.s).sort((a, b) => b.s - a.s)[0];
  const counts = Array.from({ length: 12 }, (_, i) => list.filter((e) => String(e.finishedOn).slice(5, 7) === pad(i + 1)).length);
  const bestMonth = counts.indexOf(Math.max(...counts));
  const cards = [
    bookCard('올해의 책', best, best ? `<span class="stars">${starStr(best.rating)}</span>` : ''),
    bestQ ? card(`<div class="an">올해의 명문장</div><div class="aq">“${esc(bestQ.quote)}”</div><div class="ab" data-id="${esc(bestQ.id)}" style="grid-template-columns:1fr"><div class="aw">${av(bestQ.kid, 'sm')}${esc(bestQ.kid)} · 『${esc(cleanTitle(bestQ.title))}』</div></div>`) : '',
    bookCard('가장 긴 독후감', longest, longest ? `· ${reviewLen(longest).toLocaleString()}자` : ''),
    bookCard('가장 사랑받은 독후감', loved, loved ? `· ♥ ${hearts(loved)}` : ''),
    personCard('다독상', most && most.k, most ? `${most.n}권을 읽었어요` : ''),
    personCard('장르 탐험상', explorer && explorer.k, explorer ? `${explorer.g}가지 장르를 읽었어요` : ''),
    personCard('꾸준상', steady && steady.k, steady ? `${steady.s}주 연속으로 읽었어요` : ''),
    list.length ? card(`<div class="an">가장 많이 읽은 달</div><div class="person"><b style="font-size:30px;font-weight:900">${bestMonth + 1}월</b><div class="aw">${counts[bestMonth]}권</div></div>`) : '',
  ].filter(Boolean).join('');
  $('#view').innerHTML = `<div class="month-nav"><button data-ay="-1" aria-label="이전 해">‹</button><h2>${y} 우리집 독서 시상식</h2><button data-ay="1" aria-label="다음 해">›</button></div>
    <p class="page-sub">${y}년에 다 읽은 책 ${list.length}권 중에서 뽑았어요${y === yearNow() ? ' · 12월 31일까지 바뀔 수 있어요' : ''}</p>
    ${cards ? `<div class="awards">${cards}</div>` : '<p class="empty-row">이 해에 다 읽은 책이 없어요.</p>'}`;
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), size = 240;
      const cv = document.createElement('canvas'); cv.width = cv.height = size;
      cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이 사진 형식은 열 수 없어요. JPG나 PNG 사진을 골라 주세요.')); };
    img.src = url;
  });
}
$('#photo-file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f || !photoTarget) return;
  try { await savePhoto(photoTarget, await shrink(f)); } catch (err) { $('#photo-err').textContent = err.message; }
});

}

let ed = null;
let rating = 0;
let results = [];
let searchT = 0, searchSeq = 0;
const draftKey = () => 'readlog-draft-' + (ed && ed.id ? ed.id : 'new');
const guessCountry = (author) => /옮긴이|옮김/.test(String(author || '')) ? '' : '한국';

$('#add-btn').addEventListener('click', () => openEditor(null));

function openEditor(id, finish = false) {
  $('#edit-err').textContent = '';
  if (id) {
    const e = entries.find((x) => String(x.id) === String(id)); if (!e) return;
    ed = { ...e };
    if (finish) { ed.status = 'done'; ed.finishedOn = ed.finishedOn || todayISO(); }
    restoreDraft();
    showForm(finish ? '독후감 쓰기' : '기록 고치기');
  } else {
    const meKid = CONFIG.KIDS.some((k) => k.name === ME.name) ? ME.name : '';
    ed = { status: 'done', kid: meKid || (kid !== '전체' ? kid : CONFIG.KIDS[0].name), finishedOn: todayISO() };
    if (restoreDraft() && ed.title) showForm('기록하기'); else showSearch();
  }
  $('#edit-dlg').showModal();
  if (!$('#step-search').classList.contains('hidden')) setTimeout(() => $('#book-q').focus(), 30);
}
function restoreDraft() {
  let d = null; try { d = JSON.parse(store.get(draftKey()) || 'null'); } catch {}
  if (d) { Object.assign(ed, d); $('#draft-note').textContent = '쓰던 글을 불러왔어요'; return true; }
  $('#draft-note').textContent = ''; return false;
}
function showSearch() {
  $('#edit-head').textContent = '책 추가';
  $('#step-search').classList.remove('hidden'); $('#step-form').classList.add('hidden');
  $('#book-q').value = ''; results = []; drawResults();
  setTimeout(() => $('#book-q').focus(), 30);
}
function drawResults(state) {
  const box = $('#results');
  if (state === 'loading') { box.innerHTML = '<p class="hint">찾는 중…</p>'; return; }
  if (state && state.error) { box.innerHTML = `<p class="hint">${esc(state.error)}</p>`; return; }
  if (!$('#book-q').value.trim()) { box.innerHTML = '<p class="hint big">읽은 책, 읽고 있는 책, 읽고 싶은 책의 제목을 입력해 보세요.<br>입력하는 대로 바로 찾아 드려요.</p>'; return; }
  box.innerHTML = results.length ? `<div class="rgrid">${results.map((b, i) => `
    <button class="pcard" type="button" data-i="${i}" style="--i:${i}">
      <div class="pimg"><div class="cv">${coverHTML(b)}</div></div>
      <div class="ptitle">${esc(cleanTitle(b.title))}</div>
      <div class="pauthor">${esc(firstAuthor(b.author))}</div>
      <div class="pauthor">${esc([b.publisher, String(b.pubDate || '').slice(0, 4)].filter(Boolean).join(' · '))}</div>
    </button>`).join('')}</div>` : `<p class="hint big">“${esc($('#book-q').value.trim())}”(으)로 찾은 책이 없어요.<br>
      글자가 조금 다를 수 있어요. <b>다른 표기</b>(예: 일리아드 → 일리아스)나 <b>지은이 이름</b>(예: 호메로스)으로 찾아보세요.<br>
      그래도 없으면 아래 <b>직접 입력하기</b>를 눌러 주세요.</p>`;
}
async function runSearch() {
  const q = $('#book-q').value.trim();
  const seq = ++searchSeq;
  if (!q) { results = []; drawResults(); return; }
  drawResults('loading');
  try {
    const r = await api('search', { q });
    if (seq !== searchSeq) return;
    results = r.items || [];
    drawResults();
  } catch (e) {
    if (seq !== searchSeq) return;
    drawResults({ error: e.message === 'nokey' ? '아직 카카오 키가 연결되지 않았어요. 직접 입력해 주세요.' : '검색하지 못했어요: ' + e.message });
  }
}
$('#book-q').addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(runSearch, 350); });
$('#book-search-form').addEventListener('submit', (ev) => { ev.preventDefault(); clearTimeout(searchT); runSearch(); });
$('#results').addEventListener('click', (e) => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  const book = results[+b.dataset.i];
  Object.assign(ed, book, { manual: false, country: ed.country || guessCountry(book.author) });
  showForm('기록하기');
});
$('#manual-btn').addEventListener('click', () => {
  Object.assign(ed, { title: $('#book-q').value.trim(), author: '', publisher: '', pubDate: '', isbn: '', cover: '', description: '', link: '', manual: true });
  showForm('기록하기');
});
function drawSide() {
  const back = ed.id ? '' : '<button class="link-btn" type="button" id="repick">다른 책 고르기</button>';
  $('#book-side').innerHTML = ed.manual ? `
      <div class="side-cover" id="side-cover">${coverHTML({ title: ed.title || '책 제목', author: ed.author })}</div>
      <div class="field"><label for="m-title">책 제목</label><input type="text" id="m-title" maxlength="150" value="${esc(ed.title || '')}"></div>
      <div class="field"><label for="m-author">지은이</label><input type="text" id="m-author" maxlength="150" value="${esc(ed.author || '')}"></div>${back}`
    : `<div class="side-cover">${coverHTML(ed)}</div>
      <div class="side-title">${esc(cleanTitle(ed.title))}</div>
      <div class="side-meta">${esc(ed.author || '')}</div>
      <div class="side-meta">${esc([ed.publisher, String(ed.pubDate || '').slice(0, 4)].filter(Boolean).join(' · '))}</div>
      ${ed.description ? `<div class="side-desc">${esc(ed.description)}</div>` : ''}${back}`;
}
function showForm(title) {
  $('#edit-head').textContent = title;
  $('#step-search').classList.add('hidden'); $('#step-form').classList.remove('hidden');
  drawSide();
  $('#kid-pick').innerHTML = CONFIG.KIDS.map((k) => `<label class="who-opt"><input type="radio" name="kid" value="${esc(k.name)}" ${k.name === ed.kid ? 'checked' : ''}>${av(k.name)}<span>${esc(k.name)}</span></label>`).join('');
  $('#status-pick').innerHTML = [['done', '다 읽었어요'], ['reading', '읽고 있어요'], ['want', '읽고 싶어요']].map(([k, l]) => `<label><input type="radio" name="status" value="${k}" ${k === ed.status ? 'checked' : ''}>${l}</label>`).join('');
  $('#genre-pick').innerHTML = GENRES.map((g) => `<label><input type="radio" name="genre" value="${esc(g)}" ${g === ed.genre ? 'checked' : ''}>${esc(g)}</label>`).join('');
  $('#f-country').innerHTML = '<option value="">고르세요</option>' + COUNTRIES.map((c) => `<option ${c === ed.country ? 'selected' : ''}>${esc(c)}</option>`).join('');
  $('#f-pages').value = +ed.pages || '';
  $('#rec-pick').innerHTML = `<label><input type="radio" name="rec" value="" ${!ed.recommendedBy ? 'checked' : ''}>내가 골랐어요</label>` +
    CONFIG.KIDS.map((k) => `<label><input type="radio" name="rec" value="${esc(k.name)}" ${k.name === ed.recommendedBy ? 'checked' : ''}>${av(k.name, 'sm')}${esc(k.name)}</label>`).join('');
  $('#f-date').value = ed.finishedOn || todayISO();
  $('#f-one').value = ed.oneLine || ''; $('#f-quote').value = ed.quote || ''; $('#f-review').value = ed.review || '';
  rating = +ed.rating || 0; drawStars();
  $('#count').textContent = $('#f-review').value.length + '자';
  toggleDone();
  $('#step-form .ed-main').scrollTop = 0;
}
$('#book-side').addEventListener('click', (e) => { if (e.target.id === 'repick') { store.del(draftKey()); showSearch(); } });
$('#book-side').addEventListener('input', (e) => {
  if (e.target.id === 'm-title' || e.target.id === 'm-author') {
    ed.title = $('#m-title').value; ed.author = $('#m-author').value;
    $('#side-cover').innerHTML = coverHTML({ title: ed.title || '책 제목', author: ed.author });
  }
});
const radio = (name) => (document.querySelector(`input[name=${name}]:checked`) || {}).value || '';
function curStatus() { return radio('status') || 'done'; }
function toggleDone() {
  const isDone = curStatus() === 'done';
  $('#done-fields').classList.toggle('hidden', !isDone);
  $('#save-btn').textContent = isDone ? '저장하기' : '책장에 꽂기';
}
function drawStars() { $('#star-pick').innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" data-n="${n}" class="${n <= rating ? 'on' : ''}" aria-label="별 ${n}개">★</button>`).join(''); }
$('#star-pick').addEventListener('click', (e) => { const b = e.target.closest('[data-n]'); if (!b) return; rating = +b.dataset.n === rating ? 0 : +b.dataset.n; drawStars(); saveDraft(); });
function collect() {
  return {
    ...ed,
    title: ed.manual ? ($('#m-title')?.value || '').trim() : ed.title,
    author: ed.manual ? ($('#m-author')?.value || '').trim() : ed.author,
    kid: radio('kid'), status: curStatus(), genre: radio('genre'), country: $('#f-country').value,
    pages: Math.max(0, Math.round(+$('#f-pages').value || 0)), recommendedBy: radio('rec'),
    finishedOn: $('#f-date').value, rating,
    oneLine: $('#f-one').value.trim(), quote: $('#f-quote').value.trim(), review: $('#f-review').value.trim(),
  };
}
function saveDraft() { const { id, createdAt, updatedAt, ...d } = collect(); store.set(draftKey(), JSON.stringify(d)); $('#draft-note').textContent = '임시 저장됨'; }
$('#step-form').addEventListener('input', (e) => { if (e.target.id === 'f-review') $('#count').textContent = e.target.value.length + '자'; saveDraft(); });
$('#step-form').addEventListener('change', (e) => { if (e.target.name === 'status') toggleDone(); saveDraft(); });

$('#step-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const d = collect();
  if (!d.title) { $('#edit-err').textContent = '책 제목을 써 주세요.'; return; }
  if (!d.kid) { $('#edit-err').textContent = '누가 읽었는지 골라 주세요.'; return; }
  if (d.recommendedBy === d.kid) d.recommendedBy = '';
  if (d.status !== 'done') { d.finishedOn = ''; }
  else if (!d.finishedOn) { $('#edit-err').textContent = '다 읽은 날을 골라 주세요.'; return; }
  const { manual, owner, createdAt, updatedAt, ...payload } = d;
  if (d.id) payload.baseUpdatedAt = ed.updatedAt || '';   // 그 사이 다른 사람이 고쳤는지 서버가 확인
  const wasDone = d.id && (entries.find((x) => x.id === d.id) || {}).status === 'done';
  const before = new Set(badgeList(d.kid).filter((b) => b.ok).map((b) => b.t));
  const btn = $('#save-btn'), label = btn.textContent;
  btn.disabled = true; btn.textContent = '저장 중…'; $('#edit-err').textContent = '';
  try {
    await api(d.id ? 'update' : 'add', payload);
    store.del(draftKey());
    if (kid !== '전체') { kid = d.kid; store.set('readlog-kid', kid); }
    page = 'shelf'; $('#q').value = '';
    if (d.status === 'done') { shelfTab = shelfTab === 'all' ? 'all' : 'done'; }
    await refresh();
    $('#edit-dlg').close();
    scrollTo({ top: 0, behavior: 'smooth' });
    const fresh = badgeList(d.kid).filter((b) => b.ok && !before.has(b.t));
    if (fresh.length) { confetti(); toast(`새 배지! <b>${esc(fresh.map((b) => b.t).join(', '))}</b> · ${esc(d.kid)}`); }
    else if (d.status === 'done' && !wasDone) { confetti(); const p = goalParts(); toast(`『${esc(cleanTitle(d.title))}』 다 읽기 완료! 가족 목표 <b>${p.total} / ${p.g}</b>`); }
    else toast(d.status === 'done' ? '<b>저장했어요</b>' : `<b>책장에 꽂았어요</b> · ${d.status === 'reading' ? '읽는 중' : '읽고 싶은 책'}`);
  } catch (e) {
    $('#edit-err').textContent = e.message === 'conflict' ? errMsg(e) : '저장하지 못했어요. 쓴 글은 임시 저장되어 있어요. (' + errMsg(e) + ')';
  } finally { btn.disabled = false; btn.textContent = label; }
});
</script>
</body>
</html>
